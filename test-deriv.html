
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Alex Trading Lab - Test Deriv</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 760px;
      margin: 25px auto;
      padding: 18px;
      background: #101827;
      color: #f1f5f9;
    }
    h1 { color: #60a5fa; }
    .panel {
      background: #1e293b;
      padding: 16px;
      margin: 14px 0;
      border-radius: 10px;
    }
    button, select {
      padding: 11px;
      margin: 5px 0;
      border-radius: 6px;
      font-size: 15px;
    }
    button {
      background: #2563eb;
      color: white;
      border: 0;
    }
    select { width: 100%; }
    pre {
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }
    .note { color: #cbd5e1; font-size: 14px; }
  </style>
</head>
<body>
  <h1>Alex Trading Lab</h1>
  <p>Connexion publique aux données Deriv</p>

  <div class="panel">
    <h2>1. Connexion</h2>
    <p id="etat">Non connecté</p>
    <button id="connecter">Tester la connexion</button>
  </div>

  <div class="panel">
    <h2>2. Choisir un instrument</h2>
    <select id="instrument" disabled>
      <option value="">Connecte-toi d'abord</option>
    </select>
    <button id="cours" disabled>Obtenir la dernière cotation</button>
    <pre id="resultat">Aucune cotation demandée.</pre>
  </div>

  <div class="panel">
    <h2>3. Sécurité</h2>
    <p class="note">
      Cette page utilise uniquement des requêtes publiques.
      Elle ne demande ni mot de passe ni jeton privé.
      Elle ne passe aucun ordre de trading.
    </p>
  </div>

  <script>
    const etat = document.getElementById("etat");
    const liste = document.getElementById("instrument");
    const resultat = document.getElementById("resultat");
    const boutonConnexion = document.getElementById("connecter");
    const boutonCours = document.getElementById("cours");

    let socket = null;
    let prochainId = 1;
    const requetes = new Map();

    function afficherEtat(message) {
      etat.textContent = message;
    }

    function envoyerRequete(payload) {
      return new Promise((resolve, reject) => {
        if (!socket || socket.readyState !== WebSocket.OPEN) {
          reject(new Error("La connexion WebSocket n'est pas ouverte."));
          return;
        }

        const reqId = prochainId++;
        payload.req_id = reqId;

        const delai = setTimeout(() => {
          requetes.delete(reqId);
          reject(new Error("Délai dépassé. Réessaie."));
        }, 15000);

        requetes.set(reqId, { resolve, reject, delai });
        socket.send(JSON.stringify(payload));
      });
    }

    function gererMessage(event) {
      let message;

      try {
        message = JSON.parse(event.data);
      } catch {
        return;
      }

      if (message.error) {
        const entree = message.req_id
          ? requetes.get(message.req_id)
          : null;

        if (entree) {
          clearTimeout(entree.delai);
          requetes.delete(message.req_id);
          entree.reject(new Error(message.error.message));
        } else {
          afficherEtat("Erreur API : " + message.error.message);
        }
        return;
      }

      const entree = message.req_id
        ? requetes.get(message.req_id)
        : null;

      if (entree) {
        clearTimeout(entree.delai);
        requetes.delete(message.req_id);
        entree.resolve(message);
      }
    }

    function nettoyerConnexion() {
      for (const entree of requetes.values()) {
        clearTimeout(entree.delai);
        entree.reject(new Error("Connexion interrompue."));
      }
      requetes.clear();
    }

    boutonConnexion.addEventListener("click", async () => {
      boutonConnexion.disabled = true;
      afficherEtat("Connexion en cours...");
      liste.disabled = true;
      boutonCours.disabled = true;

      try {
        if (socket) {
          socket.close();
        }

        socket = new WebSocket(
          
"wss://api.derivws.com/trading/v1/options/ws/public"
        );

        socket.addEventListener("message", gererMessage);

        await new Promise((resolve, reject) => {
          const delai = setTimeout(
            () => reject(new Error("Délai de connexion dépassé.")),
            15000
          );

          socket.addEventListener("open", () => {
            clearTimeout(delai);
            resolve();
          }, { once: true });

          socket.addEventListener("error", () => {
            clearTimeout(delai);
            reject(new Error(
              "Connexion impossible. Vérifie Internet et réessaie."
            ));
          }, { once: true });
        });

        const reponse = await envoyerRequete({
          active_symbols: "brief",
          product_type: "basic"
        });

        const instruments = reponse.active_symbols || [];

        if (instruments.length === 0) {
          throw new Error("Aucun instrument n'a été retourné.");
        }

        liste.innerHTML = "";

        instruments.forEach(item => {
          const option = document.createElement("option");
          option.value = item.symbol;
          option.textContent =
            item.display_name + " (" + item.symbol + ")";
          liste.appendChild(option);
        });

        liste.disabled = false;
        boutonCours.disabled = false;
        afficherEtat(
          "Connecté. " + instruments.length +
          " instruments reçus. Aucune authentification privée utilisée."
        );
      } catch (erreur) {
        afficherEtat("Échec : " + erreur.message);
      } finally {
        boutonConnexion.disabled = false;
      }
    });

    boutonCours.addEventListener("click", async () => {
      const symbole = liste.value;

      if (!symbole) {
        resultat.textContent = "Choisis un instrument.";
        return;
      }

      boutonCours.disabled = true;
      resultat.textContent = "Demande de cotation en cours...";

      try {
        const reponse = await envoyerRequete({
          ticks: symbole,
          subscribe: 1
        });

        if (reponse.tick) {
          resultat.textContent =
            "Instrument : " + symbole + "\n" +
            "Dernier prix : " + reponse.tick.quote + "\n" +
            "Heure Unix : " + reponse.tick.epoch + "\n\n" +
            "Cette cotation est informative. Aucun ordre n'a été envoyé.";
        } else {
          resultat.textContent =
            "Réponse reçue, mais aucune cotation disponible.";
        }
      } catch (erreur) {
        resultat.textContent = "Erreur : " + erreur.message;
      } finally {
        boutonCours.disabled = false;
      }
    });

    window.addEventListener("beforeunload", () => {
      nettoyerConnexion();
      if (socket) socket.close();
    });

    if (socket) {
      socket.addEventListener("close", () => {
        nettoyerConnexion();
        afficherEtat("Connexion fermée. Tu peux réessayer.");
        liste.disabled = true;
        boutonCours.disabled = true;
      });
    }
  </script>
</body>
</html>
