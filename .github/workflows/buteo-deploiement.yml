name: Buteo – déploiement Firebase

# Publie les règles de sécurité Firestore, les fonctions serveur (achats) et le
# site de paiement (Firebase Hosting). Les clés des prestataires de paiement
# (secrets GitHub facultatifs) sont passées aux fonctions au moment du déploiement.
# À lancer à la main : Actions → « Buteo – déploiement Firebase » → Run workflow.
# Le compte de service du secret FIREBASE_SERVICE_ACCOUNT doit avoir les rôles
# listés dans le README de Buteo (« Activer les paiements et la publicité »).
on:
  workflow_dispatch:
    inputs:
      cible:
        description: Ce qu'il faut publier
        type: choice
        options: [tout, regles, fonctions, site]
        default: tout

concurrency:
  group: buteo-deploiement
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deployer:
    name: Publier sur Firebase
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: buteo/firebase
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm install --no-audit --no-fund
        working-directory: buteo/firebase/functions
      - run: npm install --no-audit --no-fund
        working-directory: buteo/firebase/site
      - name: Publier
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          CIBLE: ${{ inputs.cible }}
          NOWPAYMENTS_API_KEY: ${{ secrets.NOWPAYMENTS_API_KEY }}
          NOWPAYMENTS_IPN_SECRET: ${{ secrets.NOWPAYMENTS_IPN_SECRET }}
          EBILLING_USERNAME: ${{ secrets.EBILLING_USERNAME }}
          EBILLING_SHARED_KEY: ${{ secrets.EBILLING_SHARED_KEY }}
          EBILLING_API_URL: ${{ vars.EBILLING_API_URL }}
          EBILLING_PORTAL_URL: ${{ vars.EBILLING_PORTAL_URL }}
          BUTEO_ADMINS: ${{ vars.BUTEO_ADMINS }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "::error::Secret FIREBASE_SERVICE_ACCOUNT manquant (voir le README de Buteo)."
            exit 1
          fi
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/compte-de-service.json"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$GOOGLE_APPLICATION_CREDENTIALS"
          PROJET=$(jq -r .project_id "$GOOGLE_APPLICATION_CREDENTIALS")
          # Clés des prestataires de paiement : seules celles qui sont configurées.
          ENV_FONCTIONS="functions/.env.$PROJET"
          trap 'rm -f "$GOOGLE_APPLICATION_CREDENTIALS" "$ENV_FONCTIONS"' EXIT
          : > "$ENV_FONCTIONS"
          for VAR in NOWPAYMENTS_API_KEY NOWPAYMENTS_IPN_SECRET EBILLING_USERNAME EBILLING_SHARED_KEY EBILLING_API_URL EBILLING_PORTAL_URL BUTEO_ADMINS; do
            if [ -n "${!VAR}" ]; then printf '%s=%s\n' "$VAR" "${!VAR}" >> "$ENV_FONCTIONS"; fi
          done
          # Les règles passent par le SDK Admin (pas de rôle supplémentaire),
          # les fonctions et le site par firebase deploy.
          case "$CIBLE" in
            regles) SEULEMENT= ;;
            fonctions) SEULEMENT=functions ;;
            site) SEULEMENT=hosting ;;
            *) SEULEMENT=functions,hosting ;;
          esac
          if [ "$CIBLE" = regles ] || [ "$CIBLE" = tout ]; then
            node publier-regles.mjs "$PROJET"
          fi
          if [ -n "$SEULEMENT" ]; then
            npx firebase deploy --only "$SEULEMENT" --project "$PROJET" --non-interactive --force
          fi
