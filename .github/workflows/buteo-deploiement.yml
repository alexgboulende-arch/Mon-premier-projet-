name: Buteo – déploiement Firebase

# Publie les règles de sécurité Firestore et les fonctions serveur (achats).
# À lancer à la main : Actions → « Buteo – déploiement Firebase » → Run workflow.
# Le compte de service du secret FIREBASE_SERVICE_ACCOUNT doit avoir les rôles
# listés dans le README de Buteo (« Activer les paiements et la publicité »).
on:
  workflow_dispatch:
    inputs:
      cible:
        description: Ce qu'il faut publier
        type: choice
        options: [tout, regles, fonctions]
        default: tout

concurrency:
  group: buteo-deploiement
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deployer:
    name: Publier sur Firebase
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: buteo/firebase
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm install --no-audit --no-fund
        working-directory: buteo/firebase/functions
      - name: Publier
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          CIBLE: ${{ inputs.cible }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "::error::Secret FIREBASE_SERVICE_ACCOUNT manquant (voir le README de Buteo)."
            exit 1
          fi
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/compte-de-service.json"
          trap 'rm -f "$GOOGLE_APPLICATION_CREDENTIALS"' EXIT
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$GOOGLE_APPLICATION_CREDENTIALS"
          PROJET=$(jq -r .project_id "$GOOGLE_APPLICATION_CREDENTIALS")
          case "$CIBLE" in
            regles) SEULEMENT=firestore:rules ;;
            fonctions) SEULEMENT=functions ;;
            *) SEULEMENT=firestore:rules,functions ;;
          esac
          npx firebase deploy --only "$SEULEMENT" --project "$PROJET" --non-interactive --force
